# SEBRING racer (BLUMR-M1): MMC3 (mapper 4), 256 KiB PRG, 128 KiB CHR, 8 KiB PRG-RAM, the BLUM cartridge.
# PRG mode 0: $8000 = R6 (road bank during a race: the kernel sets it every frame; stage/screen banks only
# while loading with IRQs off), $A000 = R7 = bank 29 (SOUND, set once at reset), $C000 = bank 30,
# $E000 = bank 31 (reset, NMI, IRQ, loaders, vectors; the only bank MMC3 guarantees at power-on).
#   0-1  road banks (curve + hill tables)      2-6  stages: nametables, palette, stage card
#   7    text screens (title, game over, ending, credits)

MEMORY {
    ZP:      start = $00,   size = $100,  type = rw, define = yes;
    RAM:     start = $0300, size = $0500, define = yes;
    HEADER:  start = $0, size = $10, file = %O, fill = yes;
    PRG0: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG1: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG2: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG3: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG4: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG5: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG6: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG7: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG8: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG9: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG10: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG11: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG12: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG13: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG14: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG15: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG16: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG17: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG18: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG19: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG20: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG21: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG22: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG23: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG24: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG25: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG26: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG27: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG28: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG29: start = $A000, size = $2000, file = %O, fill = yes, define = yes;   # SOUND (R7)
    PRGC:    start = $C000, size = $2000, file = %O, fill = yes, define = yes;
    PRGE:    start = $E000, size = $2000, file = %O, fill = yes, define = yes;
    CHR:     start = $0000, size = $20000, file = %O, fill = yes;
}

SEGMENTS {
    HEADER:   load = HEADER, type = ro;
    ROAD0:    load = PRG0, type = ro;
    ROAD1:    load = PRG1, type = ro;
    STAGE0:   load = PRG2, type = ro;
    STAGE1:   load = PRG3, type = ro;
    STAGE2:   load = PRG4, type = ro;
    STAGE3:   load = PRG5, type = ro;
    STAGE4:   load = PRG6, type = ro;
    SCREENS:  load = PRG7, type = ro;
    SOUND:    load = PRG29, type = ro, define = yes;
    ROWTABS:  load = PRGC, type = ro, align = $100;
    KERNEL:   load = PRGC, type = ro, align = $100;
    CODE:     load = PRGC, type = ro, define = yes;
    RODATA:   load = PRGC, type = ro, define = yes;
    STARTUP:  load = PRGE, type = ro, define = yes;
    FSCODE:   load = PRGE, type = ro, define = yes;
    INVTAB:   load = PRGE, type = ro, define = yes;
    VECTORS:  load = PRGE, start = $FFFA, type = ro;
    CHARS:    load = CHR, type = ro;
    ZEROPAGE: load = ZP, type = zp;
    BSS:      load = RAM, type = bss, define = yes;
}
