# NES BLUM FACTORY: MMC3 (mapper 4), 256 KiB PRG, 128 KiB CHR, 8 KiB PRG-RAM (PLAN 5.1 / 5.3).
# Derived from nesdoug 33_MMC3 MMC3_128_128.cfg (MIT, Doug Fraker), bank model kept as-is (ADR-11):
# only $8000 is swapped; $A000 (bank 29), $C000 (bank 30) and $E000 (bank 31) never change after reset.
# Reset code, NMI, IRQ, vectors and the bank-switch routines live in the last bank ($E000-$FFFF):
# do not "clean up" this file (PLAN 5.3, hardware boot rules).

MEMORY {
    ZP:       start = $00,   size = $100,  type = rw, define = yes;
    # OAM buffer at $0200, VRAM update buffer at $0700 (crt0.s)
    RAM:      start = $0300, size = $0400, define = yes;
    # WRAM map (PLAN 5.3)
    WLEVEL:   start = $6000, size = $1000, define = yes;  # level buffer, column-major, 16 bytes per column
    WSTACK:   start = $7000, size = $0800, define = yes;  # cc65 C stack
    WXRAM:    start = $7800, size = $0600, define = yes;  # BSS overflow: metatile tables, entities
    WTUNE:    start = $7E00, size = $0100, define = yes;  # live tuning block
    WPROBE:   start = $7F00, size = $0040, define = yes;  # test probe block
    WSAVE:    start = $7F80, size = $0080, define = yes;  # battery saves (stretch)

    HEADER:   start = $0, size = $10, file = %O, fill = yes;

    PRG0:  start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG1:  start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG2:  start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG3:  start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG4:  start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG5:  start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG6:  start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG7:  start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG8:  start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG9:  start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG10: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG11: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG12: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG13: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG14: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG15: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG16: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG17: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG18: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG19: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG20: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG21: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG22: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG23: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG24: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG25: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG26: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG27: start = $8000, size = $2000, file = %O, fill = yes, define = yes;
    PRG28: start = $8000, size = $2000, file = %O, fill = yes, define = yes;   # SOUND bank

    # Fixed: bank 29 at $A000 (R7, set once at reset) + bank 30 at $C000 (MMC3 second-to-last).
    PRG:   start = $A000, size = $4000, file = %O, fill = yes, define = yes;
    # Fixed: bank 31 at $E000 (MMC3 last bank). Reset/NMI/IRQ/vectors/bank switching only.
    PRGE:  start = $E000, size = $2000, file = %O, fill = yes, define = yes;

    CHR:   start = $0000, size = $20000, file = %O, fill = yes;
}

SEGMENTS {
    HEADER:   load = HEADER, type = ro;

    LOWCODE:  load = PRG, type = ro, optional = yes;
    INIT:     load = PRG, type = ro, define = yes, optional = yes;
    CODE:     load = PRG, type = ro, define = yes;
    RODATA:   load = PRG, type = ro, define = yes;
    DATA:     load = PRG, run = RAM, type = rw, define = yes;
    ONCE:     load = PRG, type = ro, define = yes, optional = yes;
    CHARS:    load = CHR, type = rw;
    BSS:      load = RAM, type = bss, define = yes;
    HEAP:     load = RAM, type = bss, optional = yes;
    ZEROPAGE: load = ZP,  type = zp;

    LEVELBUF: load = WLEVEL, type = bss, define = yes, optional = yes;
    XRAM:     load = WXRAM, type = bss, define = yes, optional = yes;
    # WTUNE ($7E00) and WPROBE ($7F00) are reserved areas the code addresses directly.

    BANK0:  load = PRG0,  type = ro, define = yes;
    BANK1:  load = PRG1,  type = ro, define = yes, optional = yes;
    BANK2:  load = PRG2,  type = ro, define = yes, optional = yes;
    BANK3:  load = PRG3,  type = ro, define = yes, optional = yes;
    BANK4:  load = PRG4,  type = ro, define = yes, optional = yes;
    BANK5:  load = PRG5,  type = ro, define = yes, optional = yes;
    BANK6:  load = PRG6,  type = ro, define = yes, optional = yes;
    BANK7:  load = PRG7,  type = ro, define = yes, optional = yes;
    BANK8:  load = PRG8,  type = ro, define = yes, optional = yes;
    BANK9:  load = PRG9,  type = ro, define = yes, optional = yes;
    BANK10: load = PRG10, type = ro, define = yes, optional = yes;
    BANK11: load = PRG11, type = ro, define = yes, optional = yes;
    BANK12: load = PRG12, type = ro, define = yes, optional = yes;
    BANK13: load = PRG13, type = ro, define = yes, optional = yes;
    BANK14: load = PRG14, type = ro, define = yes, optional = yes;
    BANK15: load = PRG15, type = ro, define = yes, optional = yes;
    BANK16: load = PRG16, type = ro, define = yes, optional = yes;
    BANK17: load = PRG17, type = ro, define = yes, optional = yes;
    BANK18: load = PRG18, type = ro, define = yes, optional = yes;
    BANK19: load = PRG19, type = ro, define = yes, optional = yes;
    BANK20: load = PRG20, type = ro, define = yes, optional = yes;
    BANK21: load = PRG21, type = ro, define = yes, optional = yes;
    BANK22: load = PRG22, type = ro, define = yes, optional = yes;
    BANK23: load = PRG23, type = ro, define = yes, optional = yes;
    BANK24: load = PRG24, type = ro, define = yes, optional = yes;
    BANK25: load = PRG25, type = ro, define = yes, optional = yes;
    BANK26: load = PRG26, type = ro, define = yes, optional = yes;
    BANK27: load = PRG27, type = ro, define = yes, optional = yes;
    SOUND:  load = PRG28, type = ro, define = yes;

    # Must stay in $E000-$FFFF (PLAN 5.3).
    STARTUP:  load = PRGE, type = ro, define = yes;
    # M4a: actors, boss interpreter and text screens (fixed code, after the reset code; PLAN 5.3 budget
    # "fixed code <= 24 KiB" covers $A000-$FFFF).
    CODE2:    load = PRGE, type = ro, define = yes, optional = yes;
    VECTORS:  load = PRGE, start = $FFFA, type = ro;
}

FEATURES {
    CONDES: segment = INIT, type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = RODATA, type = destructor, label = __DESTRUCTOR_TABLE__, count = __DESTRUCTOR_COUNT__;
    CONDES: type = interruptor, segment = RODATA, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__;
}

SYMBOLS {
    __STACKSIZE__:   type = weak, value = $0800;
    __STACK_START__: type = weak, value = $7000;
}
